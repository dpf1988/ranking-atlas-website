  to = "/blog/press-release-ai-citation-2026"
  status = 301

[[redirects]]
  from = "/resources/earned-links-vs-paid-links"
  to = "/blog/earned-links-vs-paid-links"
  status = 301

# Trailing-slash policy: strip trailing slash from any non-root URL.
# force = false lets static files (CSS, JS, fonts, images in _astro/ and assets/)
# serve normally before redirect logic runs. Without this, asset routing breaks.
[[redirects]]
  from = "/:path/"
  to = "/:path"
  status = 301
  force = false

[[redirects]]
  from = "/:first/:second/"
  to = "/:first/:second"
  status = 301
  force = false

[[redirects]]
  from = "/:first/:second/:third/"
  to = "/:first/:second/:third"
  status = 301
  force = false

[[plugins]]
  package = "./plugins/netlify-plugin-indexnow"

# ── Security headers (added 2026-07-20) ──────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Report-only first. Watch the console for a week, then rename to
    # Content-Security-Policy to enforce. cal.com needs frame-src + script;
    # Formspree needs connect-src; fonts need Google origins.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://app.cal.com https://cal.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://formspree.io https://app.cal.com https://cal.com https://api.cal.com; frame-src https://cal.com https://app.cal.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://formspree.io"
