# ── Static asset passthrough ─────────────────────────────────────────
# Serve static assets directly so the trailing-slash rules below
# (which use force = true) never intercept them. Belt-and-suspenders
# guard after disabling Netlify Pretty URLs (which caused the original
# force = false workaround in 910f529).
[[redirects]]
  from = "/_astro/*"
  to = "/_astro/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/fonts/*"
  to = "/fonts/:splat"
  status = 200
  force = true

# ── Trailing-slash policy ────────────────────────────────────────────
# Strip trailing slash from any non-root URL. force = false is required:
# with force = true, Netlify's named-segment patterns (/:path/) match
# extensionless paths even WITHOUT a trailing slash, causing infinite
# redirect loops on every page. With force = false the rules only fire
# when no static file exists at the from path. Pretty URLs is disabled
# in the Netlify UI so no content is served at trailing-slash paths,
# meaning these rules now fire correctly for /slug/ → /slug.
[[redirects]]
  from = "/:path/"
  to = "/:path"
  status = 301
  force = false

[[redirects]]
  from = "/:first/:second/"
  to = "/:first/:second"
  status = 301
  force = false

[[redirects]]
  from = "/:first/:second/:third/"
  to = "/:first/:second/:third"
  status = 301
  force = false

[[plugins]]
  package = "./plugins/netlify-plugin-indexnow"

# ── Security headers (added 2026-07-20) ──────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Report-only first. Watch the console for a week, then rename to
    # Content-Security-Policy to enforce. cal.com needs frame-src + script;
    # Formspree needs connect-src; fonts need Google origins.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://app.cal.com https://cal.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://formspree.io https://app.cal.com https://cal.com https://api.cal.com; frame-src https://cal.com https://app.cal.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://formspree.io"
